# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow: Android Meteor/Cordova Build, Sign & Publish
#
# Full pipeline: Setup → (optional pre-build hook) → Meteor build (android)
#                → Gradle sign (AAB/APK) → optional Google Play upload
#
# Use this workflow for the simple case (no custom pre-build steps needed).
# For apps that need custom steps with secret access (Firebase decode,
# config patching, asset generation, etc.), compose the actions directly:
#   - mieweb/actions/prepare-android-env@v2
#   - <your custom steps with direct ${{ secrets.* }} access>
#   - mieweb/actions/run-meteor-build@v2   (with platform: android)
#   - mieweb/actions/build-sign-android@v2
#   - mieweb/actions/publish-android-to-play@v2
#
# Callers use `secrets: inherit` — the workflow references secrets by
# conventional names directly. No per-secret mapping needed.
#
# Required secrets (org or repo level):
#   direct-keystore signing:
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   publishing:
#     GOOGLE_PLAY_JSON_KEY_BASE64
#   optional:
#     GOOGLE_SERVICES_BASE64
# ─────────────────────────────────────────────────────────────────────────────
name: Android Meteor/Cordova Build, Sign & Publish

on:
  workflow_call:
    outputs:
      artifact:
        description: "Name of the uploaded signed AAB/APK artifact"
        value: ${{ jobs.build.outputs.artifact }}
    inputs:
      # ── App identity ────────────────────────────────────────────────────────
      app_identifier:
        description: "Android applicationId (e.g. com.bluehive.ozwell)"
        required: true
        type: string
      meteor_server:
        description: "Meteor DDP server URL baked into the Cordova build"
        required: true
        type: string

      # ── Toolchain ───────────────────────────────────────────────────────────
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"
      java_version:
        description: "JDK version for the Android/Gradle build"
        required: false
        type: string
        default: "17"
      android_api_level:
        description: "Android SDK platform API level"
        required: false
        type: string
        default: "36"
      android_build_tools:
        description: "Android SDK build-tools version"
        required: false
        type: string
        default: "36.0.0"
      runner:
        description: "Runner label for the Linux build job"
        required: false
        type: string
        default: "ubuntu-latest"
      free_disk_space:
        description: "Remove unused preinstalled toolchains from the runner before building"
        required: false
        type: boolean
        default: false
      setup_pnpm:
        description: "Install pnpm (version from the caller's package.json `packageManager`)"
        required: false
        type: boolean
        default: false
      install_command:
        description: "Shell command that installs the project's dependencies"
        required: false
        type: string
        default: "meteor npm install"

      # ── Customisation hook ──────────────────────────────────────────────────
      pre_build_script:
        description: "Inline bash to run before the Meteor build. Skipped if empty."
        required: false
        type: string
        default: ""

      # ── Build configuration ─────────────────────────────────────────────────
      mobile_settings:
        description: "Path to a settings JSON file passed to `meteor build --mobile-settings`. Skipped if empty."
        required: false
        type: string
        default: ""
      signing_method:
        description: "'direct-keystore' or 'fastlane'"
        required: false
        type: string
        default: "direct-keystore"
      build_type:
        description: "'bundle' (AAB) or 'apk'"
        required: false
        type: string
        default: "bundle"

      # ── Publishing ──────────────────────────────────────────────────────────
      upload_to_play:
        description: "Upload the signed AAB to Google Play after building"
        required: false
        type: boolean
        default: true
      play_track:
        description: "Play track: internal | alpha | beta | production"
        required: false
        type: string
        default: "internal"
      rollout_fraction:
        description: "Staged rollout fraction (e.g. '0.1'). Empty = full release."
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Name of the uploaded signed artifact. Empty = `android-<build_type>`."
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      ARTIFACT_NAME: ${{ inputs.artifact_name || format('android-{0}', inputs.build_type) }}
    outputs:
      artifact: ${{ env.ARTIFACT_NAME }}
    steps:
      # ── 0. Optional: reclaim runner disk space ────────────────────────────
      # Keeps /usr/local/lib/android: setup-android reuses that SDK.
      - name: Free disk space
        if: inputs.free_disk_space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      # ── 1. Checkout, JDK, Node, Android SDK, Meteor ───────────────────────
      - name: Setup Android environment
        uses: mieweb/actions/prepare-android-env@v2
        with:
          java_version:        ${{ inputs.java_version }}
          node_version:        ${{ inputs.node_version }}
          android_api_level:   ${{ inputs.android_api_level }}
          android_build_tools: ${{ inputs.android_build_tools }}
          setup_pnpm:          ${{ inputs.setup_pnpm }}
          install_command:     ${{ inputs.install_command }}
          # Prefer a caller-supplied PAT (read:packages) for GitHub Packages
          # auth; fall back to the automatic token for same-org callers.
          github_packages_token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          # Optional SSH key for cloning private git submodules (e.g. Meteor
          # packages in separate private repos). Empty = no submodules.
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # ── 2. Pre-build hook (caller-provided script) ────────────────────────
      - name: Run pre-build script
        if: inputs.pre_build_script != ''
        shell: bash
        run: ${{ inputs.pre_build_script }}

      # ── 2b. Firebase google-services.json for the Meteor build ────────────
      # Meteor's mobile-config.js typically does
      #   App.addResourceFile('private/google-services.json', …, 'android')
      # which the Cordova build copies at `meteor build` time, so the file must
      # exist BEFORE step 3. (The Gradle signing step also writes
      # app/google-services.json, but that runs too late for this copy.)
      # No-op when GOOGLE_SERVICES_BASE64 is unset.
      - name: Write Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_BASE64" ]; then
            echo "No GOOGLE_SERVICES_BASE64 provided; skipping private/google-services.json."
            exit 0
          fi
          mkdir -p private
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > private/google-services.json
          echo "Wrote private/google-services.json ($(wc -c < private/google-services.json) bytes)."

      # ── 3. Meteor/Cordova Android build ───────────────────────────────────
      - name: Build Android with Meteor/Cordova
        uses: mieweb/actions/run-meteor-build@v2
        with:
          platform: android
          server: ${{ inputs.meteor_server }}
          output_dir: ./android-build
          mobile_settings: ${{ inputs.mobile_settings }}

      # ── 4. Gradle sign (AAB/APK) ──────────────────────────────────────────
      - name: Build & sign Android app
        id: sign
        uses: mieweb/actions/build-sign-android@v2
        with:
          signing_method:        ${{ inputs.signing_method }}
          app_identifier:        ${{ inputs.app_identifier }}
          android_build_dir:     android-build
          build_type:            ${{ inputs.build_type }}
          google_services_base64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
          keystore_base64:       ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore_password:     ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias:             ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password:          ${{ secrets.ANDROID_KEY_PASSWORD }}

      # ── 5. Keep the signed artifact before any check or upload can fail ──
      - name: Upload signed artifact
        if: always() && steps.sign.outputs.signed_artifact_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.sign.outputs.signed_artifact_path }}
          if-no-files-found: error

      # ── 6. Verify the AAB targets the requested Android API ───────────────
      - name: Verify AAB target SDK
        if: inputs.build_type == 'bundle'
        shell: bash
        env:
          AAB_PATH: ${{ steps.sign.outputs.signed_artifact_path }}
          EXPECTED_TARGET_SDK: ${{ inputs.android_api_level }}
          BUNDLETOOL_VERSION: "1.18.2"
          BUNDLETOOL_SHA256: "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584"
        run: |
          set -euo pipefail
          bundletool_jar="${RUNNER_TEMP}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --silent --show-error --location \
            --output "$bundletool_jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  ${bundletool_jar}" | sha256sum --check
          actual_target_sdk="$(java -jar "$bundletool_jar" dump manifest \
            --bundle="$AAB_PATH" \
            --xpath=/manifest/uses-sdk/@android:targetSdkVersion)"
          if [ "$actual_target_sdk" != "$EXPECTED_TARGET_SDK" ]; then
            echo "::error::AAB target SDK is ${actual_target_sdk}; expected ${EXPECTED_TARGET_SDK}. Update the consuming app's mobile-config.js target/compile SDK settings."
            exit 1
          fi
          echo "Verified AAB target SDK ${actual_target_sdk}."

      # ── 7. Upload to Google Play (optional) ───────────────────────────────
      - name: Publish to Google Play
        if: inputs.upload_to_play && inputs.build_type == 'bundle'
        uses: mieweb/actions/publish-android-to-play@v2
        with:
          signed_artifact_path: ${{ steps.sign.outputs.signed_artifact_path }}
          play_json_key_base64: ${{ secrets.GOOGLE_PLAY_JSON_KEY_BASE64 }}
          package_name:         ${{ inputs.app_identifier }}
          track:                ${{ inputs.play_track }}
          rollout_fraction:     ${{ inputs.rollout_fraction }}

      # ── 8. Run summary ────────────────────────────────────────────────────
      - name: Write run summary
        if: always()
        shell: bash
        env:
          APP_IDENTIFIER: ${{ inputs.app_identifier }}
          METEOR_SERVER:  ${{ inputs.meteor_server }}
          COMMIT_SHA:     ${{ github.sha }}
          PUBLISH:        ${{ inputs.upload_to_play && inputs.build_type == 'bundle' }}
        run: |
          {
            echo "### Android build"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| App identifier | \`$APP_IDENTIFIER\` |"
            echo "| Server | $METEOR_SERVER |"
            echo "| Build number | ${MOBILE_BUILD_NUMBER:-n/a} |"
            echo "| Commit | \`$COMMIT_SHA\` |"
            echo "| Artifact | \`$ARTIFACT_NAME\` |"
            echo "| Upload to Google Play | $PUBLISH |"
          } >> "$GITHUB_STEP_SUMMARY"
