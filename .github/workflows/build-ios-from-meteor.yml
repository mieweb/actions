# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow: iOS Meteor/Cordova Build & Upload
#
# Full pipeline: Setup → (optional pre-build hook) → Meteor build → CocoaPods
#                → Fastlane sign/archive → TestFlight upload
#
# Use this workflow for the simple case (no custom pre-build steps needed).
# For apps that need custom steps with secret access (Firebase decode,
# config patching, asset generation, etc.), compose the actions directly:
#   - mieweb/actions/prepare-meteor-cordova-env@v2
#   - <your custom steps with direct ${{ secrets.* }} access>
#   - mieweb/actions/run-meteor-build@v2
#   - mieweb/actions/sign-archive-upload-ios@v2
#
# Callers use `secrets: inherit` — the workflow references secrets by
# conventional names directly. No per-secret mapping needed.
#
# Required secrets (org or repo level):
#   APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8_BASE64
#   match mode:      MATCH_GIT_BASIC_AUTHORIZATION, MATCH_PASSWORD
#   secrets mode:    IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD,
#                    IOS_PROVISIONING_PROFILE_BASE64
#   cert-api mode:   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD
#                    (profile is downloaded via the App Store Connect API key)
# ─────────────────────────────────────────────────────────────────────────────
name: iOS Meteor/Cordova Build & Upload

on:
  workflow_call:
    outputs:
      artifact:
        description: "Name of the uploaded IPA + dSYM artifact"
        value: ${{ jobs.build.outputs.artifact }}
    inputs:
      # ── App identity ────────────────────────────────────────────────────────
      app_identifier:
        description: "Target iOS bundle ID (e.g. org.mieweb.os.dev)"
        required: true
        type: string
      meteor_server:
        description: "Meteor DDP server URL baked into the Cordova build"
        required: true
        type: string

      # ── Toolchain ───────────────────────────────────────────────────────────
      xcode_path:
        description: "Absolute path to Xcode.app"
        required: false
        type: string
        default: "/Applications/Xcode_26.app"
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"
      runner:
        description: "Runner label for the macOS build job"
        required: false
        type: string
        default: "macos-latest"
      setup_pnpm:
        description: "Install pnpm (version from the caller's package.json `packageManager`)"
        required: false
        type: boolean
        default: false
      install_command:
        description: "Shell command that installs the project's dependencies"
        required: false
        type: string
        default: "meteor npm install"

      # ── Customisation hook ──────────────────────────────────────────────────
      pre_build_script:
        description: "Inline bash to run before the Meteor build. Skipped if empty. For complex needs (custom secrets, multiple steps), compose the actions directly instead of using this workflow."
        required: false
        type: string
        default: ""

      # ── Build configuration ─────────────────────────────────────────────────
      mobile_settings:
        description: "Path to a settings JSON file passed to `meteor build --mobile-settings`. Skipped if empty."
        required: false
        type: string
        default: ""
      signing_mode:
        description: "'match', 'secrets', or 'cert-api'"
        required: false
        type: string
        default: "match"
      upload_to_testflight:
        description: "Upload IPA to TestFlight after building"
        required: false
        type: boolean
        default: true
      artifact_name:
        description: "Name of the uploaded IPA + dSYM artifact (build logs use `<name>-logs`)"
        required: false
        type: string
        default: "ios-ipa"

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      artifact: ${{ inputs.artifact_name }}
    steps:
      # ── 1. Checkout, Xcode, Node, Meteor ──────────────────────────────────
      - name: Setup Meteor environment
        uses: mieweb/actions/prepare-meteor-cordova-env@v2
        with:
          xcode_path:   ${{ inputs.xcode_path }}
          node_version: ${{ inputs.node_version }}
          setup_pnpm:      ${{ inputs.setup_pnpm }}
          install_command: ${{ inputs.install_command }}
          # Prefer a caller-supplied PAT (read:packages) for GitHub Packages
          # auth; fall back to the automatic token for same-org callers.
          github_packages_token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          # Optional SSH key for cloning private git submodules (e.g. Meteor
          # packages in separate private repos). Empty = no submodules.
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # ── 2. Pre-build hook (caller-provided script) ────────────────────────
      - name: Run pre-build script
        if: inputs.pre_build_script != ''
        shell: bash
        run: ${{ inputs.pre_build_script }}

      # ── 2b. Firebase google-services.json for the Meteor build ────────────
      # Meteor evaluates mobile-config.js for every Cordova build. If it
      # declares App.addResourceFile('private/google-services.json', …),
      # `meteor build` copies that source file during the prepare phase — even
      # for the iOS target — so it must exist BEFORE step 3 or the build fails
      # with ENOENT on private/google-services.json.
      # No-op when GOOGLE_SERVICES_BASE64 is unset.
      - name: Write Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_BASE64" ]; then
            echo "No GOOGLE_SERVICES_BASE64 provided; skipping private/google-services.json."
            exit 0
          fi
          mkdir -p private
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > private/google-services.json
          echo "Wrote private/google-services.json ($(wc -c < private/google-services.json) bytes)."

      # ── 3. Meteor/Cordova iOS build ──────────────────────────────────────
      - name: Build iOS with Meteor/Cordova
        uses: mieweb/actions/run-meteor-build@v2
        with:
          platform: ios
          server: ${{ inputs.meteor_server }}
          mobile_settings: ${{ inputs.mobile_settings }}

      # ── 4. Fastlane: pod install + sign + archive + upload ───────────────
      - name: Build & upload iOS to TestFlight
        uses: mieweb/actions/sign-archive-upload-ios@v2
        with:
          app_identifier:              ${{ inputs.app_identifier }}
          apple_team_id:               ${{ secrets.APPLE_TEAM_ID }}
          match_git_basic_authorization: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          match_password:              ${{ secrets.MATCH_PASSWORD }}
          ios_cert_p12_base64:         ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          ios_cert_password:           ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ios_prov_profile_base64:     ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          apple_api_key_id:            ${{ secrets.APPLE_API_KEY_ID }}
          apple_api_issuer_id:         ${{ secrets.APPLE_API_ISSUER_ID }}
          apple_api_key_p8_base64:     ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          signing_mode:                ${{ inputs.signing_mode }}
          run_pod_install:             "true"
          upload_to_testflight:        ${{ inputs.upload_to_testflight }}

      # ── 5. Keep the IPA, dSYM and gym logs (even if the upload failed) ────
      # Globs on the action's default output_directory: step outputs may be
      # unset when the composite step fails partway. continue-on-error keeps
      # existing callers that run this workflow twice per run (duplicate
      # default artifact name) from failing an otherwise successful build.
      - name: Upload IPA and dSYM
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ github.workspace }}/ios-ipa/*.ipa
            ${{ github.workspace }}/ios-ipa/*.dSYM.zip
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-logs
          path: ~/Library/Logs/gym
          if-no-files-found: warn

      # ── 6. Run summary ────────────────────────────────────────────────────
      - name: Write run summary
        if: always()
        shell: bash
        env:
          APP_IDENTIFIER: ${{ inputs.app_identifier }}
          METEOR_SERVER:  ${{ inputs.meteor_server }}
          COMMIT_SHA:     ${{ github.sha }}
          ARTIFACT_NAME:  ${{ inputs.artifact_name }}
          PUBLISH:        ${{ inputs.upload_to_testflight }}
        run: |
          {
            echo "### iOS build"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| App identifier | \`$APP_IDENTIFIER\` |"
            echo "| Server | $METEOR_SERVER |"
            echo "| Build number | ${MOBILE_BUILD_NUMBER:-n/a} |"
            echo "| Commit | \`$COMMIT_SHA\` |"
            echo "| Artifact | \`$ARTIFACT_NAME\` |"
            echo "| Upload to TestFlight | $PUBLISH |"
          } >> "$GITHUB_STEP_SUMMARY"
